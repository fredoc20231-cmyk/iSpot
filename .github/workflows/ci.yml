name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Unit tests (core scoring logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        # Light scientific stack only. The heavy method backends (torch,
        # tensorflow, R/Bioconductor, scanpy) are intentionally excluded — the
        # unit tests cover the pure-Python scoring/metrics logic.
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas scikit-learn anndata pytest

      - name: Run tests
        run: pytest

      - name: Check frontend JS syntax
        run: node --check ispot/frontend/app.js

  integration:
    name: Integration (boot + pipeline smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the slim deploy profile
        # Install EXACTLY the slim deploy profile (requirements-core.txt) so CI
        # verifies that the deployable image can boot the API and run the
        # pipeline/QC/viewer end to end. Excludes torch/tensorflow/R backends.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          pip install pytest httpx

      - name: Run integration tests
        run: pytest tests/integration -q
