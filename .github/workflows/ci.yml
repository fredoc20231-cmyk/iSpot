name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Unit tests (core scoring logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        # Light scientific stack only. The heavy method backends (torch,
        # tensorflow, R/Bioconductor, scanpy) are intentionally excluded — the
        # unit tests cover the pure-Python scoring/metrics logic.
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas scikit-learn anndata pytest

      - name: Run tests
        run: pytest
